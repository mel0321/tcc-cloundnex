<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagens sem Barreiras - Detalhes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        body { background-color: #f3f6fa; color: #051334; padding: 20px; }

        .details-layout { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
        
        .top-nav-actions { display: flex; justify-content: space-between; align-items: center; background: #ffffff; padding: 15px 25px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .btn-voltar-seta { display: flex; align-items: center; gap: 8px; color: #0055ff; text-decoration: none; font-weight: 700; font-size: 14px; }
        
        .btn-fav-original { background: none; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: 600; color: #475569; display: flex; align-items: center; gap: 6px; }
        .btn-fav-original.ativo { background: #fee2e2; color: #ef4444; border-color: #fca5a5; }

        .main-split { display: grid; grid-template-columns: 450px 1fr; gap: 20px; }
        .info-card-left { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; }
        .card-hero-img { width: 100%; height: 240px; object-fit: cover; background: #cbd5e1; }
        
        .card-body-padding { padding: 30px; flex: 1; }
        .cat-tag-original { display: inline-block; background: #051334; color: #ffffff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }
        .card-body-padding h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .address-original { font-size: 13px; color: #64748b; margin-bottom: 20px; display: flex; align-items: center; gap: 6px; }
        .desc-original { font-size: 14px; color: #475569; line-height: 1.6; }

        .accessibility-bar-grey { background: #f1f5f9; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e2e8f0; }
        .acc-score-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #334155; }
        .acc-score-item i { color: #0055ff; font-size: 16px; }

        .map-wrapper-right { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; overflow: hidden; min-height: 450px; }
        .map-wrapper-right iframe { width: 100%; height: 100%; border: none; }

        .comments-section-bottom { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 24px; padding: 40px; margin-top: 10px; }
        .comments-section-bottom h2 { font-size: 20px; font-weight: 700; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; }
        
        .comentario-item { border-bottom: 1px solid #f1f5f9; padding: 20px 0; }
        .comentario-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; font-weight: 600; }
        .comentario-texto { color: #475569; font-size: 14px; }

        .form-comentario { margin-top: 30px; background: #f8fafc; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; }
        .form-comentario textarea { width: 100%; height: 90px; padding: 15px; border-radius: 12px; border: 1px solid #cbd5e1; outline: none; resize: none; margin-bottom: 15px; }
        .btn-enviar-comentario { background: #0055ff; color: #ffffff; border: none; padding: 12px 24px; border-radius: 30px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="details-layout">
        <div class="top-nav-actions">
            <a href="destinos.html" class="btn-voltar-seta"><i class="fa-solid fa-arrow-left"></i> Voltar para Destinos</a>
            <button id="btnFavOriginal" class="btn-fav-original" onclick="alternarFavorito()"><i class="fa-solid fa-bookmark"></i> Favoritar</button>
        </div>

        <div class="main-split">
            <div class="info-card-left">
                <img id="local-img" class="card-hero-img" src="">
                <div class="card-body-padding">
                    <span id="local-categoria" class="cat-tag-original">Categoria</span>
                    <h1 id="local-nome">Nome do Estabelecimento</h1>
                    <div id="local-endereco" class="address-original"><i class="fa-solid fa-location-dot"></i> Endereço</div>
                    <p id="local-desc" class="desc-original">Descrição...</p>
                </div>
                <div class="accessibility-bar-grey">
                    <div class="acc-score-item">
                        <i class="fa-solid fa-wheelchair-move"></i>
                        <span>Motora: <strong id="nota-motora">0.0</strong></span>
                    </div>
                    <div class="acc-score-item">
                        <i class="fa-solid fa-person-walking-with-cane"></i>
                        <span>Visual: <strong id="nota-visual">0.0</strong></span>
                    </div>
                </div>
            </div>

            <div class="map-wrapper-right">
                <iframe id="local-mapa" src="about:blank" allowfullscreen="" loading="lazy"></iframe>
            </div>
        </div>

        <div class="comments-section-bottom">
            <h2><i class="fa-solid fa-comments"></i> Comentários e Relatos</h2>
            <div id="bloco-comentarios"></div>

            <div class="form-comentario" id="caixa-criar-comentario" style="display:none;">
                <textarea id="txt-comentario" placeholder="Escreva um relato sobre as condições reais de acessibilidade..."></textarea>
                <button class="btn-enviar-comentario" onclick="adicionarComentario()"><i class="fa-solid fa-paper-plane"></i> Publicar Relato</button>
            </div>
            <p id="msg-login-comentario" style="color:#64748b; font-size:13px; margin-top:15px; font-style: italic;">⚠️ Conecte-se para poder enviar um relato.</p>
        </div>
    </div>

    <script>
        let localAtual = null;

        document.addEventListener("DOMContentLoaded", function() {
            localAtual = JSON.parse(localStorage.getItem('destinoSelecionado'));
            if (!localAtual) { window.location.href = "destinos.html"; return; }

            document.getElementById('local-img').src = localAtual.img;
            document.getElementById('local-categoria').innerText = localAtual.categoria;
            document.getElementById('local-nome').innerText = localAtual.nome;
            document.getElementById('local-endereco').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${localAtual.endereco}`;
            document.getElementById('local-desc').innerText = localAtual.desc || "Sem descrição cadastrada.";
            document.getElementById('nota-motora').innerText = localAtual.nMotora || "4.5";
            document.getElementById('nota-visual').innerText = localAtual.nVisual || "4.2";
            
            if(localAtual.mapa) document.getElementById('local-mapa').src = localAtual.mapa;

            // Mantém o estado sincronizado com as outras páginas
            if (localStorage.getItem('tipoLogado')) {
                document.getElementById('caixa-criar-comentario').style.display = "block";
                document.getElementById('msg-login-comentario').style.display = "none";
            } else {
                document.getElementById('caixa-criar-comentario').style.display = "none";
                document.getElementById('msg-login-comentario').style.display = "block";
            }
            atualizarBotaoFavoritoUI();
            renderizarComentarios();
        });

        function renderizarComentarios() {
            const bloco = document.getElementById('bloco-comentarios'); bloco.innerHTML = "";
            const lista = localAtual.comentariosLista || [];
            if(lista.length === 0) { bloco.innerHTML = `<p style="color:#94a3b8; font-size:14px; font-style:italic;">Nenhum relato enviado ainda.</p>`; return; }
            lista.forEach(c => {
                bloco.innerHTML += `<div class="comentario-item"><div class="comentario-meta"><span>${c.autor}</span><span>${c.data}</span></div><p class="comentario-texto">${c.texto}</p></div>`;
            });
        }

        function adicionarComentario() {
            const texto = document.getElementById('txt-comentario').value.trim();
            if(!texto) return;
            
            const tipoLogado = localStorage.getItem('tipoLogado');
            const autorNome = tipoLogado === 'empresa' ? "Empresa Parceira" : "Membro da Comunidade";

            const novo = { autor: autorNome, data: new Date().toLocaleDateString('pt-BR'), texto: texto };
            let banco = JSON.parse(localStorage.getItem('bancoDestinos')) || [];
            const idx = banco.findIndex(l => l.nome === localAtual.nome);
            if(idx !== -1) {
                if(!banco[idx].comentariosLista) banco[idx].comentariosLista = [];
                banco[idx].comentariosLista.push(novo);
                localStorage.setItem('bancoDestinos', JSON.stringify(banco));
                localAtual = banco[idx];
                localStorage.setItem('destinoSelecionado', JSON.stringify(localAtual));
                document.getElementById('txt-comentario').value = "";
                renderizarComentarios();
            }
        }

        function alternarFavorito() {
            let favs = JSON.parse(localStorage.getItem('meusFavoritos')) || [];
            if(favs.some(f => f.nome === localAtual.nome)) { favs = favs.filter(f => f.nome !== localAtual.nome); } else { favs.push(localAtual); }
            localStorage.setItem('meusFavoritos', JSON.stringify(favs));
            atualizarBotaoFavoritoUI();
        }

        function atualizarBotaoFavoritoUI() {
            const favs = JSON.parse(localStorage.getItem('meusFavoritos')) || [];
            const btn = document.getElementById('btnFavOriginal');
            if(favs.some(f => f.nome === localAtual.nome)) { btn.classList.add('ativo'); btn.innerHTML = `<i class="fa-solid fa-bookmark"></i> Favoritado`; } else { btn.classList.remove('ativo'); btn.innerHTML = `<i class="fa-solid fa-bookmark"></i> Favoritar`; }
        }
    </script>
</body>
</html>
