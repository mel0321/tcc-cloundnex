<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagens sem Barreiras - Encontre seu Destino</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; transition: all 0.2s ease; }
        body { background-color: #f3f6fa; color: #051334; padding-top: 120px; }

        /* HEADER GLOBAL */
        .landing-header { position: fixed; top: 0; left: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 24px 80px; z-index: 100; background-color: rgba(243, 246, 250, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid #e2e8f0; }
        .site-logo-svg { height: 52px; width: auto; }
        .site-logo-svg .accent-blue { fill: #0055ff; }
        .site-logo-svg .accent-dark { fill: #051334; }
        .landing-nav { display: flex; align-items: center; gap: 30px; }
        .landing-nav a { color: #051334; text-decoration: none; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .landing-nav a.active { color: #0055ff; }

        /* AUTENTICAÇÃO E DROPDOWN */
        .nav-auth { display: flex; align-items: center; gap: 15px; margin-left: 15px; position: relative; }
        .btn-entrar { color: #0055ff !important; border: 1px solid #0055ff; padding: 8px 18px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: 700; cursor: pointer; }
        .btn-criar { background-color: #0055ff; color: #ffffff !important; padding: 9px 20px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: 700; cursor: pointer; }
        
        .user-avatar-btn { width: 42px; height: 42px; color: #ffffff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; font-size: 16px; user-select: none; }
        .avatar-empresa { background: #d97706; box-shadow: 0 4px 10px rgba(217, 119, 6, 0.2); }
        .avatar-usuario { background: #0055ff; box-shadow: 0 4px 10px rgba(0, 85, 255, 0.2); }
        
        .dropdown-menu { display: none; position: absolute; top: 50px; right: 0; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; width: 190px; box-shadow: 0 10px 25px rgba(5,19,52,0.1); z-index: 1000; overflow: hidden; }
        .dropdown-menu a { display: block; padding: 12px 16px; text-decoration: none; color: #051334; font-size: 14px; font-weight: 600; text-align: left; }
        .dropdown-menu a:hover { background: #f8fafc; color: #0055ff; }
        .dropdown-menu .divider { border-top: 1px solid #e2e8f0; margin: 4px 0; }

        /* MODAL DE LOGIN */
        .modal-login-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 19, 52, 0.6); backdrop-filter: blur(4px); z-index: 200; align-items: center; justify-content: center; }
        .modal-login-card { background: #ffffff; padding: 35px; border-radius: 24px; max-width: 420px; width: 90%; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        /* BUSCA E FILTROS */
        .search-container { max-width: 1200px; margin: 0 auto 30px auto; padding: 0 20px; }
        .search-box { background: #ffffff; padding: 20px; border-radius: 16px; border: 1px solid #e2e8f0; display: flex; gap: 15px; align-items: center; }
        .search-box i { color: #94a3b8; font-size: 18px; margin-left: 10px; }
        .search-box input { flex: 1; padding: 12px 20px; border-radius: 30px; border: 1px solid #cbd5e1; outline: none; font-size: 15px; }
        .filter-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-filter { background: #ffffff; border: 1px solid #cbd5e1; padding: 8px 18px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; color: #475569; display: flex; align-items: center; gap: 6px; }
        .btn-filter.active { background: #0055ff; color: #ffffff; border-color: #0055ff; }

        /* LAYOUT DOS CARDS */
        .destinations-grid { max-width: 1200px; margin: 0 auto 60px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 25px; }
        .dest-card { background: #ffffff; border-radius: 20px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; }
        .dest-img-wrapper { position: relative; height: 220px; background: #e2e8f0; }
        .dest-img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .category-tag { position: absolute; top: 15px; left: 15px; background: rgba(5, 19, 52, 0.85); color: #ffffff; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .dest-content { padding: 25px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .dest-info h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .dest-info .address { font-size: 13px; color: #64748b; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .dest-info .desc { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 20px; }
        .card-acc-badges { display: flex; gap: 8px; margin-bottom: 20px; }
        .acc-badge { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: #334155; display: flex; align-items: center; gap: 6px; }
        .acc-badge i { color: #0055ff; }
        .dest-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #f1f5f9; padding-top: 15px; }
        .rating-box { display: flex; align-items: center; gap: 5px; font-weight: 700; color: #fbbf24; }
        .btn-ver-detalhes { background: #e0eaff; color: #0055ff; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px; }
        .btn-ver-detalhes:hover { background: #0055ff; color: #ffffff; }
    </style>
</head>
<body>

    <header class="landing-header">
        <div class="landing-brand-wrapper">
            <svg class="site-logo-svg" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
                <rect class="accent-blue" x="20" y="20" width="16" height="40" rx="8" />
                <rect class="accent-dark" x="64" y="12" width="16" height="48" rx="8" />
                <text class="accent-dark" x="95" y="48" font-size="22" font-weight="700">Viagens sem</text>
                <text class="accent-blue" x="95" y="68" font-size="22" font-weight="700">Barreiras</text>
            </svg>
        </div>
        <nav class="landing-nav">
            <a href="index.html"><i class="fa-solid fa-house"></i> INÍCIO</a>
            <a href="destinos.html" class="active"><i class="fa-solid fa-compass"></i> DESTINOS</a>
            <a href="acessibilidade.html"><i class="fa-solid fa-universal-access"></i> ACESSIBILIDADE</a>
            
            <div class="nav-auth">
                <div id="area-deslogado" style="display: flex; gap: 15px;">
                    <a href="#" onclick="abrirModalLogin(); return false;" class="btn-entrar">Entrar</a>
                    <a href="#" onclick="abrirModalLogin(); return false;" class="btn-criar">Criar Conta</a>
                </div>
                
                <div id="area-logada" style="display: none;">
                    <div id="user-avatar" class="user-avatar-btn" onclick="toggleMenuDropdown()">?</div>
                    <div class="dropdown-menu" id="dropdown-perfil-empresa">
                        <a href="dashboard-negocio.html" id="link-painel-empresa"><i class="fa-solid fa-sliders"></i> Painel Empresa</a>
                        <a href="favoritos.html"><i class="fa-solid fa-bookmark"></i> Meus Favoritos</a>
                        <div class="divider"></div>
                        <a href="#" onclick="removerLoginGlobal(); return false;" style="color: #ef4444;"><i class="fa-solid fa-arrow-right-from-bracket"></i> Sair</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <div class="modal-login-overlay" id="modalLogin">
        <div class="modal-login-card">
            <div style="display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
                <button id="tab-entrar" style="flex: 1; background: none; border: none; font-weight: 700; font-size: 16px; color: #0055ff; cursor: pointer;" onclick="mudarAbaModal('entrar')">Entrar</button>
                <button id="tab-cadastrar" style="flex: 1; background: none; border: none; font-weight: 700; font-size: 16px; color: #64748b; cursor: pointer;" onclick="mudarAbaModal('cadastrar')">Criar Conta</button>
            </div>
            <div style="margin-bottom: 20px;">
                <div style="display: flex; gap: 10px;">
                    <button id="perfil-usuario" style="flex: 1; padding: 10px; border: 2px solid #0055ff; background: #f0f5ff; border-radius: 10px; font-weight: 600; font-size: 13px; cursor: pointer;" onclick="selecionarPerfilModal('usuario')"><i class="fa-solid fa-user"></i> Usuário</button>
                    <button id="perfil-empresa" style="flex: 1; padding: 10px; border: 2px solid #e2e8f0; background: #ffffff; border-radius: 10px; font-weight: 600; font-size: 13px; color: #475569; cursor: pointer;" onclick="selecionarPerfilModal('empresa')"><i class="fa-solid fa-building"></i> Empresa</button>
                </div>
            </div>
            <form id="form-autenticacao" onsubmit="processarAutenticacao(event)" style="display: flex; flex-direction: column; gap: 15px; text-align: left;">
                <div id="campo-nome-cadastro" style="display: none;">
                    <label style="display:block; font-size:12px; font-weight:700; color:#475569; margin-bottom:4px;">Nome / Razão Social</label>
                    <input type="text" id="auth-nome" placeholder="Seu nome" style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; outline:none;">
                </div>
                <div>
                    <label style="display:block; font-size:12px; font-weight:700; color:#475569; margin-bottom:4px;">E-mail</label>
                    <input type="email" id="auth-email" placeholder="seuemail@exemplo.com" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; outline:none;">
                </div>
                <div>
                    <label style="display:block; font-size:12px; font-weight:700; color:#475569; margin-bottom:4px;">Senha</label>
                    <input type="password" id="auth-senha" placeholder="••••••••" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; outline:none;">
                </div>
                <button type="submit" id="btn-submit-auth" style="background:#0055ff; color:#ffffff; border:none; padding:14px; border-radius:30px; font-weight:700; cursor:pointer; font-size:14px; text-align: center;"><i class="fa-solid fa-check"></i> Avançar</button>
            </form>
            <button onclick="fecharModalLogin()" style="margin-top: 20px; background: none; border: none; color: #64748b; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline;">Cancelar</button>
        </div>
    </div>

    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="input-busca" placeholder="Digite o nome do local ou endereço..." oninput="filtrarDestinos()">
        </div>
        <div class="filter-buttons">
            <button class="btn-filter active" onclick="filtrarPorCategoria('Todos', this)"><i class="fa-solid fa-border-all"></i> Todos</button>
            <button class="btn-filter" onclick="filtrarPorCategoria('Restaurante', this)"><i class="fa-solid fa-utensils"></i> Restaurantes</button>
            <button class="btn-filter" onclick="filtrarPorCategoria('Hospedagem', this)"><i class="fa-solid fa-bed"></i> Hospedagem</button>
            <button class="btn-filter" onclick="filtrarPorCategoria('Ponto Turístico', this)"><i class="fa-solid fa-camera"></i> Pontos Turísticos</button>
        </div>
    </div>

    <main class="destinations-grid" id="grid-destinos-publicos"></main>

    <script>
        let categoriaAtual = "Todos";
        let modoAtual = 'entrar';
        let perfilSelecionado = 'usuario';

        document.addEventListener("DOMContentLoaded", function() {
            verificarEstadoLoginGlobal();

            if (!localStorage.getItem('bancoDestinos')) {
                const basePadrao = [
                    { nome: "Restaurante Central", categoria: "Restaurante", endereco: "Rua das Flores, Centro 123 - SP", desc: "Cozinha contemporânea com foco em inclusão e conforto para todos os públicos.", img: "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=500", notaGeral: "4.8", nMotora: "4.8", nVisual: "4.5", comentariosLista: [] },
                    { nome: "Hotel Paraíso Acessível", categoria: "Hospedagem", endereco: "Av Oceanica, 450 - BA", desc: "Quartos amplos adaptados e rampa com acesso direto à areia da praia.", img: "https://images.unsplash.com/photo-1566073771259-6a8506099945?w=500", notaGeral: "5.0", nMotora: "5.0", nVisual: "4.0", comentariosLista: [] }
                ];
                localStorage.setItem('bancoDestinos', JSON.stringify(basePadrao));
            }
            renderizarCards();

            window.addEventListener('click', function(e) {
                const dropdown = document.getElementById('dropdown-perfil-empresa');
                const avatarBtn = document.getElementById('user-avatar');
                if (dropdown && !dropdown.contains(e.target) && avatarBtn && !avatarBtn.contains(e.target)) {
                    dropdown.style.display = 'none';
                }
            });
        });

        function abrirModalLogin() { document.getElementById('modalLogin').style.display = 'flex'; mudarAbaModal('entrar'); }
        function fecharModalLogin() { document.getElementById('modalLogin').style.display = 'none'; }

        function mudarAbaModal(modo) {
            modoAtual = modo;
            const tabEntrar = document.getElementById('tab-entrar');
            const tabCadastrar = document.getElementById('tab-cadastrar');
            const campoNome = document.getElementById('campo-nome-cadastro');
            const btnSubmit = document.getElementById('btn-submit-auth');

            if(modo === 'entrar') {
                tabEntrar.style.color = '#0055ff'; tabEntrar.style.borderBottom = '2px solid #0055ff';
                tabCadastrar.style.color = '#64748b'; tabCadastrar.style.borderBottom = 'none';
                campoNome.style.display = 'none';
                btnSubmit.innerHTML = '<i class="fa-solid fa-check"></i> Acessar Plataforma';
            } else {
                tabCadastrar.style.color = '#0055ff'; tabCadastrar.style.borderBottom = '2px solid #0055ff';
                tabEntrar.style.color = '#64748b'; tabEntrar.style.borderBottom = 'none';
                campoNome.style.display = 'block';
                btnSubmit.innerHTML = '<i class="fa-solid fa-user-plus"></i> Concluir Cadastro';
            }
        }

        function selecionarPerfilModal(perfil) {
            perfilSelecionado = perfil;
            const btnUsuario = document.getElementById('perfil-usuario');
            const btnEmpresa = document.getElementById('perfil-empresa');
            if(perfil === 'usuario') {
                btnUsuario.style.borderColor = '#0055ff'; btnUsuario.style.background = '#f0f5ff';
                btnEmpresa.style.borderColor = '#e2e8f0'; btnEmpresa.style.background = '#ffffff';
            } else {
                btnEmpresa.style.borderColor = '#0055ff'; btnEmpresa.style.background = '#f0f5ff';
                btnUsuario.style.borderColor = '#e2e8f0'; btnUsuario.style.background = '#ffffff';
            }
        }

        function processarAutenticacao(event) {
            event.preventDefault();
            localStorage.setItem('tipoLogado', perfilSelecionado);
            fecharModalLogin();
            window.location.reload();
        }

        function removerLoginGlobal() {
            localStorage.removeItem('tipoLogado');
            window.location.reload();
        }

        function verificarEstadoLoginGlobal() {
            const tipoLogado = localStorage.getItem('tipoLogado');
            const areaDeslogado = document.getElementById('area-deslogado');
            const areaLogada = document.getElementById('area-logada');
            const avatar = document.getElementById('user-avatar');
            const linkEmpresa = document.getElementById('link-painel-empresa');

            if (tipoLogado) {
                areaDeslogado.style.display = "none";
                areaLogada.style.display = "block";
                if(tipoLogado === 'empresa') {
                    avatar.innerText = "E"; avatar.className = "user-avatar-btn avatar-empresa";
                    if(linkEmpresa) linkEmpresa.style.display = "block";
                } else {
                    avatar.innerText = "U"; avatar.className = "user-avatar-btn avatar-usuario";
                    if(linkEmpresa) linkEmpresa.style.display = "none";
                }
            } else {
                areaDeslogado.style.display = "flex";
                areaLogada.style.display = "none";
            }
        }

        function toggleMenuDropdown() {
            const dropdown = document.getElementById('dropdown-perfil-empresa');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
        }

        function renderizarCards() {
            const listaLocais = JSON.parse(localStorage.getItem('bancoDestinos')) || [];
            const container = document.getElementById('grid-destinos-publicos');
            const termoBusca = document.getElementById('input-busca').value.toLowerCase();
            container.innerHTML = "";

            listaLocais.forEach(local => {
                const bateCategoria = (categoriaAtual === "Todos" || local.categoria === categoriaAtual);
                const bateTexto = local.nome.toLowerCase().includes(termoBusca) || local.endereco.toLowerCase().includes(termoBusca);

                if (bateCategoria && bateTexto) {
                    container.innerHTML += `
                        <div class="dest-card">
                            <div class="dest-img-wrapper">
                                <span class="category-tag">${local.categoria}</span>
                                <img src="${local.img}">
                            </div>
                            <div class="dest-content">
                                <div class="dest-info">
                                    <h3>${local.nome}</h3>
                                    <div class="address"><i class="fa-solid fa-location-dot"></i> ${local.endereco}</div>
                                    <p class="desc">${local.desc || "Sem descrição."}</p>
                                    <div class="card-acc-badges">
                                        <div class="acc-badge"><i class="fa-solid fa-wheelchair-move"></i> M: ${local.nMotora}</div>
                                        <div class="acc-badge"><i class="fa-solid fa-person-walking-with-cane"></i> V: ${local.nVisual}</div>
                                    </div>
                                </div>
                                <div class="dest-footer">
                                    <div class="rating-box"><i class="fa-solid fa-star"></i> ${local.notaGeral}</div>
                                    <button class="btn-ver-detalhes" onclick="verDetalhesDoLocal('${local.nome}')"><i class="fa-solid fa-circle-info"></i> Ver Detalhes</button>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function filtrarPorCategoria(cat, elemento) {
            categoriaAtual = cat;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            elemento.classList.add('active');
            renderizarCards();
        }
        function filtrarDestinos() { renderizarCards(); }

        function verDetalhesDoLocal(nomeLocal) {
            const listaLocais = JSON.parse(localStorage.getItem('bancoDestinos')) || [];
            const localEncontrado = listaLocais.find(l => l.nome === nomeLocal);
            if (localEncontrado) {
                localStorage.setItem('destinoSelecionado', JSON.stringify(localEncontrado));
                window.location.href = "detalhes.html";
            }
        }
    </script>
</body>
</html>
