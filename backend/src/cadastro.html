<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viagens sem Barreiras - Início</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. CONFIGURAÇÕES GERAIS E MENU
           ========================================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f3f6fa;
            color: #000000;
            overflow-x: hidden;
        }

        .site-logo-svg {
            height: 48px;
            width: auto;
            display: block;
        }
        .site-logo-svg .accent-blue { fill: #0055ff; }
        .site-logo-svg .accent-dark { fill: #051334; }

        .landing-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 80px;
            z-index: 100;
            background-color: rgba(243, 246, 250, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e2e8f0;
        }

        .landing-nav {
            display: flex;
            gap: 40px;
        }

        .landing-nav a {
            color: #051334;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .landing-nav a:hover, .landing-nav a.active {
            color: #0055ff;
        }

        .landing-actions-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .landing-actions-right .link-cadastro {
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            color: #051334;
            cursor: pointer;
        }

        .landing-actions-right .btn-login {
            background-color: #000000;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ==========================================================================
           2. PAISAGEM DE FUNDO E PESQUISA
           ========================================================================== */
        .hero-container {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 600px;
            background-image: linear-gradient(rgba(5, 19, 52, 0.4), rgba(5, 19, 52, 0.5)), url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 20px;
            text-align: center;
        }

        .hero-container h1 {
            font-size: 56px;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .hero-container p {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 40px;
            max-width: 600px;
        }

        .search-wrapper {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(5, 19, 52, 0.2);
            display: flex;
            align-items: center;
            width: 100%;
            max-width: 850px;
            gap: 15px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            padding: 10px 15px;
            border-right: 1px solid #e2e8f0;
        }

        .search-box:last-of-type { border-right: none; }
        .search-box i { color: #0055ff; font-size: 18px; }
        .search-box div { display: flex; flex-direction: column; align-items: flex-start; width: 100%; }
        .search-box label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 2px; }
        .search-box input, .search-box select { border: none; outline: none; width: 100%; font-size: 14px; font-weight: 600; color: #051334; background: transparent; }

        .btn-search {
            background-color: #0055ff;
            color: #ffffff;
            border: none;
            padding: 16px 35px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        /* ==========================================================================
           3. DESIGN DA CAIXA DE CADASTRO EXATA (SEM LINKS DE TEXTO)
           ========================================================================== */
        .auth-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 19, 52, 0.6);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .auth-modal-overlay.active { opacity: 1; pointer-events: auto; }

        .auth-modal-card {
            background-color: #ffffff;
            width: 90%;
            max-width: 450px;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 50px rgba(5, 19, 52, 0.15);
            border: 1px solid #e2e8f0;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .auth-modal-overlay.active .auth-modal-card { transform: translateY(0); }

        .btn-close-auth {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 18px;
            color: #94a3b8;
            cursor: pointer;
        }

        .auth-title { font-size: 24px; font-weight: 700; color: #051334; margin-bottom: 8px; text-align: left; }
        .auth-subtitle { font-size: 13px; color: #64748b; margin-bottom: 25px; text-align: left; }

        /* Botoes de tipo (Viajante / Negocio) estruturados */
        .tipo-usuario-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-tipo {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            background: #ffffff;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #051334;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .btn-tipo.active {
            border-color: #0055ff;
            background-color: #0055ff;
            color: #ffffff;
        }

        .auth-form { display: none; flex-direction: column; gap: 15px; }
        .auth-form.active { display: flex; }

        .input-group { display: flex; flex-direction: column; gap: 6px; }
        .input-group label { font-size: 11px; font-weight: 700; color: #051334; text-transform: uppercase; }

        .input-field {
            width: 100%;
            padding: 13px 16px;
            background-color: #f1f5f9;
            border: 1px solid transparent;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            color: #051334;
            outline: none;
        }

        .input-field:focus { border-color: #0055ff; background-color: #ffffff; }

        .btn-auth-submit {
            background-color: #0055ff;
            color: #ffffff;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .auth-footer-toggle {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }

        .auth-footer-toggle span {
            color: #0055ff;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header class="landing-header">
        <div class="landing-brand-wrapper">
            <svg class="site-logo-svg" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
                <rect class="accent-blue" x="20" y="20" width="16" height="40" rx="8" />
                <rect class="accent-blue" x="42" y="28" width="16" height="32" rx="8" />
                <rect class="accent-dark" x="64" y="12" width="16" height="48" rx="8" />
                <text class="accent-dark" x="95" y="48" font-family="'Inter', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">Viagens sem</text>
                <text class="accent-blue" x="95" y="68" font-family="'Inter', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.5">Barreiras</text>
            </svg>
        </div>
        <nav class="landing-nav">
            <a href="index.html" class="active">INÍCIO</a>
            <a href="destinos.html">DESTINOS</a>
            <a href="#">ACESSIBILIDADE</a>
            <a href="#">SOBRE NÓS</a>
        </nav>
        <div class="landing-actions-right">
            <span class="link-cadastro" onclick="abrirModal('cadastro')">CRIAR CONTA</span>
            <span class="btn-login" onclick="abrirModal('login')">ENTRAR</span>
        </div>
    </header>

    <section class="hero-container">
        <h1>Turismo Acessível e Inclusivo</h1>
        <p>Explore destinos validados e planeje sua próxima viagem com total autonomia.</p>
        
        <div class="search-wrapper">
            <div class="search-box">
                <i class="fa-solid fa-location-dot"></i>
                <div>
                    <label>Para onde vamos?</label>
                    <input type="text" placeholder="Explore destinos acessíveis...">
                </div>
            </div>
            
            <div class="search-box">
                <i class="fa-solid fa-wheelchair"></i>
                <div>
                    <label>Acessibilidade</label>
                    <select>
                        <option value="">Selecione a principal</option>
                        <option value="motora">Acessibilidade Motora</option>
                        <option value="visual">Acessibilidade Visual</option>
                        <option value="auditiva">Acessibilidade Auditiva</option>
                        <option value="mobilidade">Mobilidade Reduzida</option>
                    </select>
                </div>
            </div>
            <button class="btn-search">Buscar</button>
        </div>
    </section>

    <div class="auth-modal-overlay" id="auth-modal">
        <div class="auth-modal-card">
            <button class="btn-close-auth" onclick="fecharModal()"><i class="fa-solid fa-xmark"></i></button>

            <h3 class="auth-title" id="m-title">Cadastre-se</h3>
            <p class="auth-subtitle" id="m-subtitle">Escolha o tipo de perfil e preencha os dados.</p>

            <div class="tipo-usuario-container">
                <button class="btn-tipo active" id="tipo-viajante" onclick="setTipo('viajante')">Viajante</button>
                <button class="btn-tipo" id="tipo-negocio" onclick="setTipo('negocio')">Negócio</button>
            </div>

            <form id="f-cad-viajante" class="auth-form" onsubmit="event.preventDefault();">
                <div class="input-group"><label>Nome Completo</label><input type="text" class="input-field" placeholder="Nome Completo" required></div>
                <div class="input-group"><label>E-mail</label><input type="email" class="input-field" placeholder="seu@email.com" required></div>
                <div class="input-group"><label>Telemóvel / Celular</label><input type="tel" class="input-field" placeholder="+351 900 000 000" required></div>
                <div class="input-group"><label>Senha</label><input type="password" class="input-field" placeholder="Crie uma senha" required></div>
                <div class="input-group"><label>Confirmar Senha</label><input type="password" class="input-field" placeholder="Repita a senha" required></div>
                <button type="submit" class="btn-auth-submit">CADASTRAR VIAJANTE</button>
            </form>

            <form id="f-cad-negocio" class="auth-form" onsubmit="event.preventDefault();">
                <div class="input-group"><label>Nome do Negócio / Empresa</label><input type="text" class="input-field" placeholder="Ex: Hotel Central" required></div>
                <div class="input-group"><label>E-mail Corporativo</label><input type="email" class="input-field" placeholder="contato@empresa.com" required></div>
                <div class="input-group"><label>Telefone Comercial</label><input type="tel" class="input-field" placeholder="+351 200 000 000" required></div>
                <div class="input-group"><label>Senha</label><input type="password" class="input-field" placeholder="******" required></div>
                <div class="input-group"><label>Confirmar Senha</label><input type="password" class="input-field" placeholder="******" required></div>
                <button type="submit" class="btn-auth-submit" style="background-color: #051334;">CADASTRAR EMPRESA</button>
            </form>

            <form id="f-login-viajante" class="auth-form" onsubmit="event.preventDefault();">
                <div class="input-group"><label>E-mail de Viajante</label><input type="email" class="input-field" placeholder="seu@email.com" required></div>
                <div class="input-group"><label>Senha</label><input type="password" class="input-field" placeholder="******" required></div>
                <button type="submit" class="btn-auth-submit">ENTRAR COMO VIAJANTE</button>
            </form>

            <form id="f-login-negocio" class="auth-form" onsubmit="event.preventDefault();">
                <div class="input-group"><label>E-mail Corporativo</label><input type="email" class="input-field" placeholder="empresa@email.com" required></div>
                <div class="input-group"><label>Senha</label><input type="password" class="input-field" placeholder="******" required></div>
                <button type="submit" class="btn-auth-submit" style="background-color: #051334;">ACESSAR PAINEL</button>
            </form>

            <div class="auth-footer-toggle" id="footer-toggle-box">
                <p id="toggle-text">Já possui conta? <span onclick="mudarModo()">Acessar conta</span></p>
            </div>

        </div>
    </div>

    <script>
        let modoAtual = 'cadastro'; // cadastro ou login
        let tipoAtual = 'viajante'; // viajante ou negocio

        function abrirModal(modo) {
            document.getElementById('auth-modal').classList.add('active');
            modoAtual = modo;
            atualizarInterface();
        }

        function fecharModal() { 
            document.getElementById('auth-modal').classList.remove('active'); 
        }

        function setTipo(tipo) {
            tipoAtual = tipo;
            document.getElementById('tipo-viajante').classList.toggle('active', tipo === 'viajante');
            document.getElementById('tipo-negocio').classList.toggle('active', tipo === 'negocio');
            atualizarInterface();
        }

        function mudarModo() {
            modoAtual = (modoAtual === 'cadastro') ? 'login' : 'cadastro';
            atualizarInterface();
        }

        function atualizarInterface() {
            // Esconde todos os forms primeiro
            document.getElementById('f-cad-viajante').classList.remove('active');
            document.getElementById('f-cad-negocio').classList.remove('active');
            document.getElementById('f-login-viajante').classList.remove('active');
            document.getElementById('f-login-negocio').classList.remove('active');

            const title = document.getElementById('m-title');
            const toggleText = document.getElementById('toggle-text');

            if (modoAtual === 'cadastro') {
                title.innerText = "Cadastre-se";
                toggleText.innerHTML = 'Já possui conta? <span onclick="mudarModo()">Acessar conta</span>';
                
                if (tipoAtual === 'viajante') {
                    document.getElementById('f-cad-viajante').classList.add('active');
                } else {
                    document.getElementById('f-cad-negocio').classList.add('active');
                }
            } else {
                title.innerText = "Acessar Conta";
                toggleText.innerHTML = 'Não tem conta? <span onclick="mudarModo()">Criar agora</span>';

                if (tipoAtual === 'viajante') {
                    document.getElementById('f-login-viajante').classList.add('active');
                } else {
                    document.getElementById('f-login-negocio').classList.add('active');
                }
            }
        }

        document.getElementById('auth-modal').addEventListener('click', function(e) { 
            if (e.target === this) fecharModal(); 
        });
    </script>
</body>
</html>
